<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263e37"><title>合租战争 · 自由生活版</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><canvas id="world" aria-label="俯视公寓，可使用方向键移动，E 键互动"></canvas>
<section id="menu" class="overlay menu"><div class="menu-copy"><p class="eyebrow">一屋四季 · 合租日常</p><h1>合租战争</h1><h2>十日公约</h2><p class="subtitle">走进房间，遇见各自的生活。</p><div class="menu-actions"><button id="new-game" class="primary">搬进来 <span>新游戏 →</span></button><button id="continue">继续生活 <span>↗</span></button><p id="save-info"></p><button id="collection-menu">结局收藏</button><button id="menu-settings" class="quiet">设置</button></div><p class="version">自由探索 · 十天的合租日常</p></div><div class="menu-note">今天的客厅，似乎会有些不一样。</div></section>
<section id="hud" hidden><header><div class="day"><span>合租手记</span><strong>第 1 天 <i>· 傍晚</i></strong></div><div class="tools"><button id="favors">搭把手</button><button id="collection-play">结局</button><button id="roster">住户</button><button id="journal">手记</button><button id="settings">设置</button><button id="home">菜单</button></div></header><aside id="quest"><span id="quest-tag">日常</span><h3 id="quest-title"></h3><p id="quest-detail"></p></aside><div id="prompt"></div><footer><span id="controls-help">WASD / 方向键移动 · 点击地面寻路 · E 互动</span><span id="saved">自动存档</span></footer><div id="joystick" aria-label="拖动摇杆移动"><div id="stick"></div></div><button id="interact" class="primary">互动 <kbd>E</kbd></button></section>
<section id="conversation" hidden aria-live="polite"><div class="speech"><div id="speaker"></div><p id="speech-text"></p><span id="speech-hint">点击画面继续</span></div><div id="choices" hidden></div></section>
<section id="relationship" hidden role="status"><div id="deltas"></div></section>
<section id="ending" class="overlay" hidden><article><p class="eyebrow">DAY 01 · 沙发客上门</p><h1>第一天结束</h1><p>行李放好了。今晚，客厅留了一盏灯。</p><h3>一起定下的约定</h3><p id="end-agreement"></p><div id="end-relations"></div><div id="epilogues"></div><p class="end-note">当前可玩内容到此结束。</p><div class="end-actions"><button id="end-home">返回主菜单</button><button id="next-day" class="primary">睡醒，继续明天</button><button id="replay">重新开始十天</button></div></article></section>
<div id="toast" hidden role="status"></div></main><dialog id="modal"><div id="modal-body"></div><button id="modal-close">好的</button></dialog><section id="rotate"><span>↻</span><h2>横过来，进屋看看</h2><p>这间公寓适合横屏探索。</p></section>
<script src="data.js"></script><script src="days.js"></script><script src="world.js"></script><script src="campaign.js"></script><script src="life.js"></script><script src="game.js"></script></body></html>
